<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h2 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .stat-card .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
        }

        .filter-select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .refresh-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .table-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 16px 18px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        tr {
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f8f9ff;
            transform: scale(1.01);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }

        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-low {
            background-color: #ffe0e0;
            color: #d32f2f;
        }

        .badge-medium {
            background-color: #fff3e0;
            color: #f57c00;
        }

        .badge-high {
            background-color: #e8f5e9;
            color: #388e3c;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #667eea;
            font-size: 18px;
        }

        .loading::after {
            content: "...";
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: #999;
            font-size: 18px;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Orders Dashboard</h2>
            <p style="color: #666; margin-top: 5px;">Track and manage all your orders in real-time</p>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="icon">&#128202;</div>
                <div class="number" id="totalOrders">0</div>
                <div class="label">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="icon">&#128200;</div>
                <div class="number" id="totalQuantity">0</div>
                <div class="label">Total Quantity</div>
            </div>
            <div class="stat-card">
                <div class="icon">&#128197;</div>
                <div class="number" id="todayOrders">0</div>
                <div class="label">Today's Orders</div>
            </div>
            <div class="stat-card">
                <div class="icon">&#128101;</div>
                <div class="number" id="uniqueCustomers">0</div>
                <div class="label">Unique Customers</div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by product, model, or customer name...">
                <span class="search-icon">&#128269;</span>
            </div>
            <select class="filter-select" id="quantityFilter">
                <option value="">All Quantities</option>
                <option value="low">Low (1-10)</option>
                <option value="medium">Medium (11-50)</option>
                <option value="high">High (51+)</option>
            </select>
            <button class="refresh-btn" onclick="loadOrders()">&#128259; Refresh</button>
        </div>

        <div class="table-container">
            <table id="ordersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Model</th>
                        <th>Quantity</th>
                        <th>Ordered By</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="loading">Loading orders</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allOrders = [];

        function getQuantityBadge(quantity) {
            if (quantity <= 10) return '<span class="badge badge-low">' + quantity + '</span>';
            if (quantity <= 50) return '<span class="badge badge-medium">' + quantity + '</span>';
            return '<span class="badge badge-high">' + quantity + '</span>';
        }

        function updateStats(orders) {
            const totalOrders = orders.length;
            const totalQuantity = orders.reduce((sum, order) => sum + order.quantityOrdered, 0);
            const today = new Date().toISOString().split('T')[0];
            const todayOrders = orders.filter(order => order.orderDate.startsWith(today)).length;
            const uniqueCustomers = new Set(orders.map(order => order.orderedBy)).size;

            document.getElementById('totalOrders').textContent = totalOrders;
            document.getElementById('totalQuantity').textContent = totalQuantity;
            document.getElementById('todayOrders').textContent = todayOrders;
            document.getElementById('uniqueCustomers').textContent = uniqueCustomers;
        }

        function filterOrders() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const quantityFilter = document.getElementById('quantityFilter').value;

            let filtered = allOrders.filter(order => {
                const matchesSearch = 
                    order.productName.toLowerCase().includes(searchTerm) ||
                    order.model.toLowerCase().includes(searchTerm) ||
                    order.orderedBy.toLowerCase().includes(searchTerm);

                let matchesQuantity = true;
                if (quantityFilter === 'low') matchesQuantity = order.quantityOrdered <= 10;
                if (quantityFilter === 'medium') matchesQuantity = order.quantityOrdered > 10 && order.quantityOrdered <= 50;
                if (quantityFilter === 'high') matchesQuantity = order.quantityOrdered > 50;

                return matchesSearch && matchesQuantity;
            });

            renderOrders(filtered);
        }

        function renderOrders(orders) {
            const tableBody = document.querySelector("#ordersTable tbody");
            tableBody.innerHTML = "";

            if (orders.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" class="no-data">No orders found</td></tr>';
                return;
            }

            orders.forEach((order, index) => {
                const row = document.createElement("tr");
                row.style.animationDelay = (index * 0.05) + 's';
                row.innerHTML = `
                    <td><strong>#${order.id}</strong></td>
                    <td>${order.productName}</td>
                    <td>${order.model}</td>
                    <td>${getQuantityBadge(order.quantityOrdered)}</td>
                    <td>${order.orderedBy}</td>
                    <td>${new Date(order.orderDate).toLocaleDateString('en-US', { 
                        year: 'numeric', 
                        month: 'short', 
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        function loadOrders() {
            const tableBody = document.querySelector("#ordersTable tbody");
            tableBody.innerHTML = '<tr><td colspan="6" class="loading pulse">Loading orders</td></tr>';

            fetch("http://localhost:8080/api/orders")
                .then(response => response.json())
                .then(data => {
                    allOrders = data;
                    updateStats(allOrders);
                    filterOrders();
                })
                .catch(error => {
                    console.error("Error loading orders:", error);
                    tableBody.innerHTML = '<tr><td colspan="6" class="no-data" style="color: #d32f2f;">Error loading orders. Please try again.</td></tr>';
                });
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', filterOrders);
        document.getElementById('quantityFilter').addEventListener('change', filterOrders);

        // Initial load
        loadOrders();

        // Auto-refresh every 30 seconds
        setInterval(loadOrders, 30000);
    </script>
</body>
</html>
